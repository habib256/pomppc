name: CI

on:
  push:
    branches: [main]
    tags: ['0.*', 'v*']
  pull_request:

jobs:
  hote:
    name: Harnais hôte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilateur et Python
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 pkg-config
      - name: Non-régression
        run: |
          # Le harnais traite shellcheck comme optionnel : absent sur le Mac
          # de référence, il est ignoré. Le runner Ubuntu l'a déjà, et ses
          # avertissements préexistants feraient échouer la publication.
          if command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get remove -y shellcheck
          fi
          bash tests/run-all.sh
